# Copie este arquivo para togglemaster-secrets.yaml, substitua os valores e
# nunca versione a cópia. O .gitignore já protege o nome sem ".example".
apiVersion: v1
kind: Secret
metadata:
  name: togglemaster-secrets
  namespace: togglemaster
  labels:
    app.kubernetes.io/part-of: togglemaster
type: Opaque
stringData:
  AUTH_DB_PASSWORD: substitua-esta-senha
  CONFIG_DB_PASSWORD: substitua-esta-senha
  MASTER_KEY: substitua-esta-chave
  SERVICE_API_KEY: substitua-depois-do-bootstrap
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
