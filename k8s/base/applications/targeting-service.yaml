apiVersion: v1
kind: Service
metadata:
  name: targeting-service
  labels:
    app.kubernetes.io/name: targeting-service
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: togglemaster
spec:
  selector:
    app.kubernetes.io/name: targeting-service
  ports:
    - name: http
      port: 8003
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: targeting-service
  labels:
    app.kubernetes.io/name: targeting-service
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: togglemaster
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: targeting-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: targeting-service
        app.kubernetes.io/component: application
        app.kubernetes.io/part-of: togglemaster
    spec:
      serviceAccountName: targeting-service
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - until pg_isready -h postgres-config -U config_user -d targeting_db; do sleep 2; done
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
        - name: wait-for-auth
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - until wget -qO- http://auth-service:8001/health >/dev/null; do sleep 2; done
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: targeting-service
          image: togglemaster/targeting-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8003
          env:
            - name: PORT
              value: "8003"
            - name: GUNICORN_WORKERS
              value: "2"
            - name: CONFIG_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: togglemaster-secrets
                  key: CONFIG_DB_PASSWORD
            - name: DATABASE_URL
              value: postgres://config_user:$(CONFIG_DB_PASSWORD)@postgres-config:5432/targeting_db?sslmode=disable
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: togglemaster-config
                  key: AUTH_SERVICE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
