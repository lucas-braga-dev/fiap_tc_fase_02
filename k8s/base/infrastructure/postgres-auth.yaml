apiVersion: v1
kind: Service
metadata:
  name: postgres-auth
  labels:
    app.kubernetes.io/name: postgres-auth
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: togglemaster
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres-auth
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-auth
  labels:
    app.kubernetes.io/name: postgres-auth
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: togglemaster
spec:
  serviceName: postgres-auth
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-auth
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: togglemaster
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: auth_db
            - name: POSTGRES_USER
              value: auth_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: togglemaster-secrets
                  key: AUTH_DB_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "auth_user", "-d", "auth_db"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "auth_user", "-d", "auth_db"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "auth_user", "-d", "auth_db"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: postgres-auth-init
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: postgres-auth
          app.kubernetes.io/part-of: togglemaster
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
