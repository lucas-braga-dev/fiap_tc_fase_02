apiVersion: batch/v1
kind: Job
metadata:
  name: localstack-bootstrap
  labels:
    app.kubernetes.io/name: localstack-bootstrap
    app.kubernetes.io/component: initializer
    app.kubernetes.io/part-of: togglemaster
spec:
  backoffLimit: 20
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: localstack-bootstrap
        app.kubernetes.io/component: initializer
        app.kubernetes.io/part-of: togglemaster
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: localstack/localstack:3.8
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-ec"]
          args:
            - |
              until awslocal --endpoint-url="${AWS_ENDPOINT_URL}" sqs list-queues >/dev/null 2>&1; do
                echo "Aguardando o LocalStack..."
                sleep 3
              done

              awslocal --endpoint-url="${AWS_ENDPOINT_URL}" sqs create-queue \
                --queue-name togglemaster-events >/dev/null

              if ! awslocal --endpoint-url="${AWS_ENDPOINT_URL}" dynamodb describe-table \
                --table-name "${AWS_DYNAMODB_TABLE}" >/dev/null 2>&1; then
                awslocal --endpoint-url="${AWS_ENDPOINT_URL}" dynamodb create-table \
                  --table-name "${AWS_DYNAMODB_TABLE}" \
                  --attribute-definitions AttributeName=event_id,AttributeType=S \
                  --key-schema AttributeName=event_id,KeyType=HASH \
                  --billing-mode PAY_PER_REQUEST >/dev/null
              fi

              echo "Fila e tabela locais prontas."
          env:
            - name: AWS_ENDPOINT_URL
              valueFrom:
                configMapKeyRef:
                  name: togglemaster-config
                  key: AWS_ENDPOINT_URL
            - name: AWS_DYNAMODB_TABLE
              valueFrom:
                configMapKeyRef:
                  name: togglemaster-config
                  key: AWS_DYNAMODB_TABLE
            - name: AWS_DEFAULT_REGION
              valueFrom:
                configMapKeyRef:
                  name: togglemaster-config
                  key: AWS_REGION
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: togglemaster-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: togglemaster-secrets
                  key: AWS_SECRET_ACCESS_KEY
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
