apiVersion: v1
kind: Service
metadata:
  name: localstack
  labels:
    app.kubernetes.io/name: localstack
    app.kubernetes.io/component: aws-emulator
    app.kubernetes.io/part-of: togglemaster
spec:
  selector:
    app.kubernetes.io/name: localstack
  ports:
    - name: edge
      port: 4566
      targetPort: edge
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: localstack-data
  labels:
    app.kubernetes.io/name: localstack
    app.kubernetes.io/part-of: togglemaster
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  labels:
    app.kubernetes.io/name: localstack
    app.kubernetes.io/component: aws-emulator
    app.kubernetes.io/part-of: togglemaster
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: localstack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: localstack
        app.kubernetes.io/component: aws-emulator
        app.kubernetes.io/part-of: togglemaster
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: localstack
          image: localstack/localstack:3.8
          imagePullPolicy: IfNotPresent
          ports:
            - name: edge
              containerPort: 4566
          env:
            - name: SERVICES
              value: sqs,dynamodb
            - name: AWS_DEFAULT_REGION
              valueFrom:
                configMapKeyRef:
                  name: togglemaster-config
                  key: AWS_REGION
            - name: PERSISTENCE
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /_localstack/health
              port: edge
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: edge
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /_localstack/health
              port: edge
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/localstack
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: localstack-data
