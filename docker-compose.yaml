name: togglemaster-local

services:
  # ==========================================================
  # Bancos de dados
  # ==========================================================

  postgres-auth:
    image: postgres:16-alpine
    container_name: togglemaster-postgres-auth
    restart: unless-stopped

    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}

    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
      - ./auth-service/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    ports:
      - "5432:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U auth_user -d auth_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - togglemaster-network

  postgres-config:
    image: postgres:16-alpine
    container_name: togglemaster-postgres-config
    restart: unless-stopped

    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: config_user
      POSTGRES_PASSWORD: ${CONFIG_DB_PASSWORD}

    volumes:
      - postgres-config-data:/var/lib/postgresql/data
      - ./infra/postgres-config/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./flag-service/db/init.sql:/opt/togglemaster/flags.sql:ro
      - ./targeting-service/db/init.sql:/opt/togglemaster/targeting.sql:ro

    ports:
      - "5433:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U config_user -d postgres"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - togglemaster-network

  redis:
    image: redis:7.2-alpine
    container_name: togglemaster-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis-data:/data

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - togglemaster-network

  localstack:
    image: localstack/localstack:3.8
    container_name: togglemaster-localstack
    restart: unless-stopped

    environment:
      SERVICES: sqs,dynamodb
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}

    ports:
      - "4566:4566"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - togglemaster-network
    
  # ==========================================================
  # Microsserviços
  # ==========================================================

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile

    image: togglemaster/auth-service:local
    container_name: togglemaster-auth
    restart: unless-stopped

    environment:
      PORT: "8001"
      DATABASE_URL: >-
        postgres://auth_user:${AUTH_DB_PASSWORD}@postgres-auth:5432/auth_db?sslmode=disable
      MASTER_KEY: ${MASTER_KEY}

    ports:
      - "8001:8001"

    depends_on:
      postgres-auth:
        condition: service_healthy

    networks:
      - togglemaster-network

  flag-service:
    build:
      context: ./flag-service
      dockerfile: Dockerfile

    image: togglemaster/flag-service:local
    container_name: togglemaster-flag
    restart: unless-stopped

    environment:
      PORT: "8002"
      DATABASE_URL: >-
        postgres://config_user:${CONFIG_DB_PASSWORD}@postgres-config:5432/flags_db?sslmode=disable
      AUTH_SERVICE_URL: http://auth-service:8001

    ports:
      - "8002:8002"

    depends_on:
      postgres-config:
        condition: service_healthy
      auth-service:
        condition: service_started

    networks:
      - togglemaster-network

  targeting-service:
    build:
      context: ./targeting-service
      dockerfile: Dockerfile

    image: togglemaster/targeting-service:local
    container_name: togglemaster-targeting
    restart: unless-stopped

    environment:
      PORT: "8003"
      DATABASE_URL: >-
        postgres://config_user:${CONFIG_DB_PASSWORD}@postgres-config:5432/targeting_db?sslmode=disable
      AUTH_SERVICE_URL: http://auth-service:8001

    ports:
      - "8003:8003"

    depends_on:
      postgres-config:
        condition: service_healthy
      auth-service:
        condition: service_started

    networks:
      - togglemaster-network

  evaluation-service:
    build:
      context: ./evaluation-service
      dockerfile: Dockerfile

    image: togglemaster/evaluation-service:local
    container_name: togglemaster-evaluation
    restart: unless-stopped

    environment:
      PORT: "8004"
      REDIS_URL: redis://redis:6379
      FLAG_SERVICE_URL: http://flag-service:8002
      TARGETING_SERVICE_URL: http://targeting-service:8003
      SERVICE_API_KEY: ${SERVICE_API_KEY}

      AWS_REGION: ${AWS_REGION}
      AWS_SQS_URL: ${AWS_SQS_URL}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://localstack:4566}

      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}

    ports:
      - "8004:8004"

    depends_on:
      redis:
        condition: service_healthy
      flag-service:
        condition: service_started
      targeting-service:
        condition: service_started

    networks:
      - togglemaster-network

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile

    image: togglemaster/analytics-service:local
    container_name: togglemaster-analytics
    restart: unless-stopped

    environment:
      PORT: "8005"

      AWS_REGION: ${AWS_REGION}
      AWS_SQS_URL: ${AWS_SQS_URL}
      AWS_DYNAMODB_TABLE: ${AWS_DYNAMODB_TABLE:-ToggleMasterAnalytics}

      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://localstack:4566}

    ports:
      - "8005:8005"

    depends_on:
      localstack:
        condition: service_started

    networks:
      - togglemaster-network

# ============================================================
# Volumes
# ============================================================

volumes:
  postgres-auth-data:
  postgres-config-data:
  redis-data:

# ============================================================
# Rede
# ============================================================

networks:
  togglemaster-network:
    driver: bridge
